# Grafana Alloy ships the app's pod logs to Loki (via the Kubernetes API, so no node access needed).
controller:
  type: deployment
  replicas: 1
alloy:
  resources:
    requests: {cpu: 25m, memory: 64Mi}
  configMap:
    content: |
      discovery.kubernetes "pods" {
        role = "pod"
        namespaces { names = ["hms"] }
      }

      discovery.relabel "pods" {
        targets = discovery.kubernetes.pods.targets
        rule {
          source_labels = ["__meta_kubernetes_namespace"]
          target_label  = "namespace"
        }
        rule {
          source_labels = ["__meta_kubernetes_pod_name"]
          target_label  = "pod"
        }
        rule {
          source_labels = ["__meta_kubernetes_pod_label_app"]
          target_label  = "app"
        }
      }

      loki.source.kubernetes "pods" {
        targets    = discovery.relabel.pods.output
        forward_to = [loki.process.levels.receiver]
      }

      // Lines are JSON; promote `level` to a label so "errors only" is a cheap filter.
      loki.process "levels" {
        stage.json {
          expressions = {level = "level"}
        }
        stage.labels {
          values = {level = ""}
        }
        forward_to = [loki.write.default.receiver]
      }

      loki.write "default" {
        endpoint {
          url = "http://loki.monitoring:3100/loki/api/v1/push"
        }
      }

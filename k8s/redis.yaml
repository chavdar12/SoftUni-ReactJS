apiVersion: v1
kind: Service
metadata:
  name: redis
spec:
  selector: {app: redis}
  ports: [{port: 6379}]
---
# Persistent (AOF) so refresh tokens survive a restart and users stay signed in.
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: redis
spec:
  serviceName: redis
  replicas: 1
  selector:
    matchLabels: {app: redis}
  template:
    metadata:
      labels: {app: redis}
    spec:
      enableServiceLinks: false
      containers:
        - name: redis
          image: redis:8-alpine
          args: [redis-server, --appendonly, "yes"]
          ports: [{containerPort: 6379}]
          resources:
            requests: {cpu: 50m, memory: 64Mi}
            limits: {memory: 256Mi}
          readinessProbe:
            exec: {command: [redis-cli, ping]}
            periodSeconds: 5
          livenessProbe:
            exec: {command: [redis-cli, ping]}
            periodSeconds: 15
          volumeMounts: [{name: data, mountPath: /data}]
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes: [ReadWriteOnce]
        resources:
          requests: {storage: 256Mi}

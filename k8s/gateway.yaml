apiVersion: v1
kind: Service
metadata:
  name: gateway
spec:
  type: LoadBalancer  # Docker Desktop maps this to localhost:8080
  selector: {app: gateway}
  ports: [{port: 8080, targetPort: 80}]
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: gateway
spec:
  replicas: 2  # fixed: nginx is cheap; two keep the entry point up while one restarts
  strategy:
    rollingUpdate: {maxUnavailable: 0, maxSurge: 1}
  selector:
    matchLabels: {app: gateway}
  template:
    metadata:
      labels: {app: gateway}
    spec:
      enableServiceLinks: false
      containers:
        - name: gateway
          image: hms-gateway:dev
          imagePullPolicy: IfNotPresent
          ports: [{name: http, containerPort: 80}]
          env:
            - {name: RESOLVER, value: kube-dns.kube-system.svc.cluster.local}
            - {name: IDENTITY_HOST, value: identity-pods.hms.svc.cluster.local}
            - {name: APPOINTMENTS_HOST, value: appointments-pods.hms.svc.cluster.local}
            - {name: OTEL_ENDPOINT, value: tempo.monitoring.svc.cluster.local:4317}
          resources:
            requests: {cpu: 50m, memory: 32Mi}
            limits: {memory: 128Mi}
          readinessProbe:
            httpGet: {path: /healthz, port: http}
            periodSeconds: 5
          livenessProbe:
            httpGet: {path: /healthz, port: http}
            periodSeconds: 10
          lifecycle:
            preStop:
              sleep: {seconds: 5}

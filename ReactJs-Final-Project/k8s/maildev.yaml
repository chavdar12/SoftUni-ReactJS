# MailDev: a fake SMTP server with a web inbox, for testing. Catches every email (and mock SMS) the services send.
# Inbox: kubectl -n hms port-forward svc/maildev 1080  ->  http://localhost:1080
apiVersion: v1
kind: Service
metadata:
  name: maildev
spec:
  selector: {app: maildev}
  ports:
    - {name: smtp, port: 1025}
    - {name: web, port: 1080}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: maildev
spec:
  replicas: 1
  selector:
    matchLabels: {app: maildev}
  template:
    metadata:
      labels: {app: maildev}
    spec:
      enableServiceLinks: false
      containers:
        - name: maildev
          image: maildev/maildev:3.0.0
          ports: [{name: smtp, containerPort: 1025}, {name: web, containerPort: 1080}]
          resources:
            requests: {cpu: 10m, memory: 64Mi}
            limits: {memory: 128Mi}
